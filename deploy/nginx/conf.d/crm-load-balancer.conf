# ==============================================================================
# Guru Horticulture CRM & HRM - High-Concurrency Reverse Proxy & Load Balancer
# Handles 100+ simultaneous employee logins without queuing or lag
# ==============================================================================

# 1. Upstream Load Balancer: Distributes traffic across 2 independent PHP-FPM pools
upstream crm_php_backend {
    least_conn; # Routes new login to worker pool with lowest active connections

    server unix:/run/php/php8.2-fpm-pool1.sock max_fails=3 fail_timeout=10s weight=1;
    server unix:/run/php/php8.2-fpm-pool2.sock max_fails=3 fail_timeout=10s weight=1;

    # Keepalive connections to PHP-FPM to avoid TCP/socket handshake overhead
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.guruhorticulture.biz localhost 127.0.0.1;

    # Document Root points to Laravel's public directory
    root /var/www/Guru_CRM/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Rate Limiting & Concurrency Guard
    limit_conn addr_limit 50;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==============================================================================
    # 2. Static Assets Direct Offloading (ZERO PHP Execution for CSS/JS/Images)
    # 100 users downloading assets hit Nginx directly from memory cache
    # ==============================================================================
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|pdf)$ {
        expires 30d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # ==============================================================================
    # 3. Dedicated Rate-Limited Login & Punch Endpoints
    # Protects /login and /employee-login from brute-force spam while allowing genuine users
    # ==============================================================================
    location ~* ^/(login|employee-login) {
        limit_req zone=login_limit burst=20 nodelay;

        include fastcgi_params;
        fastcgi_pass crm_php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # FastCGI Buffer Optimization
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;
    }

    # ==============================================================================
    # 4. Standard Laravel Application Routing
    # ==============================================================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass crm_php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Keepalive fastcgi connection
        fastcgi_keep_conn on;

        # FastCGI Buffering (Prevents slow clients from holding PHP-FPM workers)
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;
    }

    # Deny access to hidden files and sensitive dotfiles (.env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
