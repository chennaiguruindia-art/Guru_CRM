; ==============================================================================
; OPcache Configuration for Production High-Performance Laravel
; Eliminates PHP disk read & compilation overhead
; ==============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

; In production, avoid checking file timestamps on every request
; Run `php artisan optimize:clear` or reload php-fpm on deployment
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Keep comments for Laravel PHPDoc attributes & reflection
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.file_cache_only = 0
