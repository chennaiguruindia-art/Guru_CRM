; ==============================================================================
; PHP-FPM Pool 2 - Secondary Worker Pool for Load Balancing
; Combined with Pool 1: Total 120 concurrent PHP workers available
; ==============================================================================
[crm_pool2]

user = www-data
group = www-data

listen = /run/php/php8.2-fpm-pool2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 1024

; Process Manager: Dynamic allocation
pm = dynamic
pm.max_children = 60
pm.start_servers = 15
pm.min_spare_servers = 10
pm.max_spare_servers = 25
pm.max_requests = 1000

; Memory & Execution Limits
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M

; Logging & Timeouts
request_terminate_timeout = 60s
slowlog = /var/log/php8.2-fpm-pool2-slow.log
request_slowlog_timeout = 3s
catch_workers_output = yes
clear_env = no
